<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thongtincancuocongdan-NguyenThienPhu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; /* Nền màu trắng tuyệt đối */
            height: 100vh;
            display: flex;
            justify-content: center; /* Căn giữa ảnh theo chiều ngang */
            align-items: center;     /* Căn giữa ảnh theo chiều dọc */
        }

        img {
            max-width: 90%;          /* Tự động co giãn phù hợp với màn hình */
            max-height: 90vh;
            border-radius: 8px;      /* Bo tròn nhẹ góc ảnh (nếu không thích có thể xóa dòng này) */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Thay 'my-photo.jpg' Thongtincancuoccongdan -->
    <img src="my-photo.jpg" alt="Ảnh cá nhân">

</body>
</html>
